name: passnote
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  encrypt: ^5.0.3
  flutter_secure_storage: ^10.0.0
  image_picker: ^1.2.1
  http: ^1.6.0
  camera: ^0.12.0+1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  provider: ^6.1.2
  google_fonts: ^6.2.1
  supabase_flutter: ^2.0.0
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.png"